# Deploy: drag this folder to app.netlify.com/drop, or connect the repo. No build step.
[build]
  publish = "."

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/clips/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
